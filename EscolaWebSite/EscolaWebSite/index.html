<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscolaWebSite - Sistema</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

            .links a {
                color: white;
                text-decoration: none;
                padding: 15px 25px;
                background: rgba(255, 255, 255, 0.15);
                border-radius: 10px;
                transition: all 0.3s ease;
                font-size: 18px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

                .links a:hover {
                    background: rgba(255, 255, 255, 0.25);
                    transform: translateY(-2px);
                    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                }

                .links a .badge {
                    background: rgba(255, 255, 255, 0.2);
                    padding: 2px 12px;
                    border-radius: 20px;
                    font-size: 12px;
                }

        .status {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 14px;
        }

            .status .online {
                color: #4ade80;
                font-weight: bold;
            }

        .version {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .links a {
                font-size: 16px;
                padding: 12px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🏫</div>
        <h1>EscolaWebSite</h1>
        <p class="subtitle">Sistema de Controle de Matrículas</p>

        <div class="links">
            <a href="/alunos.html">
                👨‍🎓 Interface de Alunos
                <span class="badge">HTML</span>
            </a>
            <a href="/api/alunos">
                📚 Listar Alunos
                <span class="badge">JSON</span>
            </a>
            <a href="/api/turmas">
                🏫 Listar Turmas
                <span class="badge">JSON</span>
            </a>
            <a href="/api/relatorios/alunos-por-turma">
                📊 Relatório por Turma
                <span class="badge">JSON</span>
            </a>
            <a href="/api/matriculas" onclick="event.preventDefault(); alert('Use POST para criar matrícula');">
                📝 Matrículas
                <span class="badge">POST</span>
            </a>
        </div>

        <div class="status">
            <span class="online">🟢 API Online</span>
            <br>
            <span class="version">Versão 1.0 | .NET Framework 4.8 | Dapper</span>
        </div>
    </div>

    <script>
        console.log('🏫 EscolaWebSite - Sistema de Matrículas');
        console.log('📚 Endpoints disponíveis:');
        console.log('  - GET  /api/alunos');
        console.log('  - GET  /api/alunos/{id}');
        console.log('  - POST /api/alunos');
        console.log('  - PUT  /api/alunos/{id}');
        console.log('  - DELETE /api/alunos/{id}');
        console.log('  - GET  /api/turmas');
        console.log('  - POST /api/matriculas');
        console.log('  - GET  /api/relatorios/alunos-por-turma');
    </script>
</body>

</html>
